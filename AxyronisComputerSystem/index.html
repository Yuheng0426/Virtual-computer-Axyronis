<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axyronis Computer System</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="boot" class="boot-screen">
      <div class="boot-mark" aria-hidden="true">
        <span>A</span>
      </div>
      <div class="boot-title">Axyronis</div>
      <div class="boot-subtitle">Personal Computing Environment</div>
      <div class="boot-track">
        <div class="boot-bar"></div>
      </div>
    </div>

    <main id="os" class="os is-hidden" aria-label="Axyronis computer system desktop">
      <section id="desktop" class="desktop" aria-label="Desktop">
        <div class="desktop-shade"></div>
        <div class="desktop-status">
          <div class="desktop-brand">
            <span class="mini-mark">A</span>
            <span>Axyronis</span>
          </div>
          <div class="quick-stats" aria-label="System status">
            <span id="desktopClock">--:--</span>
            <span>Quantum Link</span>
            <span>92%</span>
          </div>
        </div>
        <div id="desktopIcons" class="desktop-icons"></div>
        <aside class="desktop-widgets" aria-label="Desktop widgets">
          <button class="widget widget-clock" data-action="toggle-notifications" title="Open notification center">
            <span id="widgetDate">Today</span>
            <strong id="widgetTime">--:--</strong>
          </button>
          <button class="widget widget-performance" data-open-app="system" title="Open System Monitor">
            <span>Workspace health</span>
            <strong><b id="widgetHealth">94</b>%</strong>
            <i><em id="widgetHealthBar"></em></i>
          </button>
        </aside>
        <div id="windowLayer" class="window-layer"></div>
      </section>

      <div id="desktopMenu" class="desktop-menu" aria-hidden="true">
        <button data-action="refresh-desktop">Refresh</button>
        <button data-open-app="settings">Personalize</button>
        <button data-open-app="terminal">Open in Terminal</button>
        <button data-open-app="notes">New Note</button>
        <button data-action="open-command-palette">Command Palette</button>
        <button data-open-app="about">About Axyronis</button>
      </div>

      <aside id="startMenu" class="start-menu" aria-label="Start menu" aria-hidden="true">
        <div class="start-top">
          <div class="user-chip">
            <div class="avatar">A</div>
            <div>
              <strong>Axyronis User</strong>
              <span>Local Administrator</span>
            </div>
          </div>
          <button class="icon-button" data-action="toggle-start" title="Close start menu">X</button>
        </div>
        <label class="search-box" aria-label="Search apps">
          <span>/</span>
          <input id="appSearch" type="search" placeholder="Search apps, files, and settings" autocomplete="off" />
        </label>
        <div class="start-section">
          <div class="section-heading">Pinned Apps</div>
          <div id="pinnedApps" class="pinned-grid"></div>
        </div>
        <div class="start-section">
          <div class="section-heading">Recommended</div>
          <div id="recommendations" class="recommendations"></div>
        </div>
        <div class="start-actions">
          <button class="text-button" data-action="open-command-palette">Command Palette</button>
          <button class="text-button" data-open-app="settings">Settings</button>
          <button class="text-button danger" data-action="reboot">Restart Demo</button>
        </div>
      </aside>

      <aside id="quickCenter" class="quick-center" aria-label="Quick center" aria-hidden="true">
        <div class="quick-center-top">
          <strong>Quick Center</strong>
          <button class="icon-button" data-action="toggle-quick-center" title="Close quick center">X</button>
        </div>
        <div class="quick-toggle-grid">
          <button class="quick-toggle active">Quantum Link</button>
          <button class="quick-toggle active">Focus Mode</button>
          <button class="quick-toggle">Night Shift</button>
          <button class="quick-toggle">Silent Mode</button>
        </div>
        <label class="slider-row">
          <span>Brightness</span>
          <input type="range" min="10" max="100" value="86" />
        </label>
        <label class="slider-row">
          <span>Interface Scale</span>
          <input type="range" min="80" max="120" value="100" />
        </label>
      </aside>

      <div id="commandPalette" class="command-palette" aria-hidden="true">
        <div class="command-panel">
          <label class="search-box" aria-label="Command search">
            <span>></span>
            <input id="commandSearch" type="search" placeholder="Type a command or app name" autocomplete="off" />
          </label>
          <div id="commandResults" class="command-results"></div>
        </div>
      </div>

      <section id="taskView" class="task-view" aria-label="Task view" aria-hidden="true">
        <header>
          <div><span>WORKSPACES</span><strong>Task View</strong></div>
          <button class="icon-button" data-action="toggle-task-view" title="Close task view">X</button>
        </header>
        <div id="taskViewGrid" class="task-view-grid"></div>
        <footer>
          <button class="text-button" data-action="new-workspace">Arrange workspace</button>
          <span>Win + Tab</span>
        </footer>
      </section>

      <aside id="notificationCenter" class="notification-center" aria-label="Notification center" aria-hidden="true">
        <header>
          <div><span>ACTIVITY</span><strong>Notifications</strong></div>
          <button class="icon-button" data-action="clear-notifications" title="Clear notifications">Clear</button>
        </header>
        <div id="notificationList" class="notification-list"></div>
        <section class="calendar-strip">
          <span id="calendarMonth">This month</span>
          <div id="calendarDays"></div>
        </section>
      </aside>

      <div class="dock-reveal-zone" aria-hidden="true"></div>
      <nav class="taskbar" aria-label="Dock">
        <button id="startButton" class="start-button" title="Start">
          <span class="start-glyph">A</span>
        </button>
        <div id="taskbarApps" class="taskbar-apps"></div>
        <div class="system-tray">
          <button class="tray-button" data-action="open-command-palette" title="Search and commands">SEARCH</button>
          <button class="tray-button" data-action="toggle-task-view" title="Task View">VIEW</button>
          <button class="tray-button" data-action="toggle-notifications" title="Notifications">BELL<span id="notificationBadge" class="notification-badge">0</span></button>
          <button class="tray-button" data-action="toggle-quick-center" title="Quick Center">CTRL</button>
          <div class="tray-clock">
            <strong id="trayTime">--:--</strong>
            <span id="trayDate">--/--</span>
          </div>
        </div>
      </nav>
    </main>

    <template id="windowTemplate">
      <section class="app-window" role="dialog" aria-modal="false">
        <header class="window-titlebar">
          <div class="window-title">
            <span class="app-symbol"></span>
            <span class="app-name"></span>
          </div>
          <div class="window-controls">
            <button class="window-button" data-window-action="minimize" title="Minimize">_</button>
            <button class="window-button" data-window-action="snap" title="Snap window">||</button>
            <button class="window-button" data-window-action="maximize" title="Maximize">[]</button>
            <button class="window-button close" data-window-action="close" title="Close">X</button>
          </div>
        </header>
        <div class="window-body"></div>
      </section>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
